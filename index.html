
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة عهد التعليمية</title>
<style>
body {
  font-family: Tahoma, Arial, sans-serif;
  background: #f1edff;
  color: #30265c;
  text-align: center;
  padding: 25px;
}
main {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 22px;
  box-shadow: 0 5px 20px #d8cff5;
}
h1 { color: #7055d9; }
button {
  background: #7055d9;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  margin: 6px;
  cursor: pointer;
}
</style>
</head>
<body>
<main>
  <h1>🌟 منصة عهد التعليمية 🌟</h1>
  <p>أهلًا بك في عالم التعلّم والإبداع!</p>
  <h2>📚 دروسي</h2>
  <button onclick="alert('مرحبًا بك في درس الرياضيات!')">الرياضيات</button>
  <button onclick="alert('مرحبًا بك في درس العلوم!')">العلوم</button>
  <button onclick="alert('مرحبًا بك في درس اللغة العربية!')">اللغة العربية</button>
  <h2>📝 واجباتي</h2>
  <p>ذاكري واجباتك واجتهدي، فأنتِ تستطيعين النجاح! 💗</p>
  <h2>🏆 أنا أستطيع التعلّم!</h2>
</main>
</body>
</html>
